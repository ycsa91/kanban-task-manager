name: CI/CD Pipeline

# 1. Disparadores (Triggers): ¿Cuándo se ejecuta este pipeline?
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Permisos necesarios para publicar imágenes en GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # JOB 1: Integración Continua del Backend (Laravel + PHPUnit)
  # =========================================================================
  backend-ci:
    name: Backend CI (Laravel)
    runs-on: ubuntu-latest

    # Fijamos la carpeta de trabajo para no repetir "cd task-manager-api"
    defaults:
      run:
        working-directory: ./task-manager-api

    steps:
      - name: 1. Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar PHP 8.2 y extensiones
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, pdo, pdo_sqlite, bcmath
          coverage: none

      - name: 3. Instalar dependencias de Composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: 4. Preparar archivo .env de prueba y generar APP_KEY
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: 5. Ejecutar pruebas automatizadas (PHPUnit)
        run: php artisan test

  # =========================================================================
  # JOB 2: Integración Continua del Frontend (React + TypeScript + Vite)
  # =========================================================================
  frontend-ci:
    name: Frontend CI (React + TS)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./task-manager-front

    steps:
      - name: 1. Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22 con caché de npm
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./task-manager-front/package-lock.json

      - name: 3. Instalar dependencias exactas (Clean Install)
        run: npm ci

      - name: 4. Analizar código con el Linter (Oxlint)
        run: npm run lint

      - name: 5. Verificar tipos TypeScript y compilar build de producción
        run: npm run build

  # =========================================================================
  # JOB 3: Entrega Continua / CD (Construir y Publicar Imágenes Docker)
  # =========================================================================
  docker-cd:
    name: Docker Build & Push (GHCR)
    runs-on: ubuntu-latest
    # IMPORTANTE: Este job SOLO corre si backend-ci y frontend-ci terminaron en verde
    needs: [backend-ci, frontend-ci]

    steps:
      - name: 1. Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: 2. Iniciar sesión en GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. Construir (y publicar en main) imagen Docker del Backend
        uses: docker/build-push-action@v6
        with:
          context: ./task-manager-api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/kanban-api:latest

      - name: 4. Construir (y publicar en main) imagen Docker del Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./task-manager-front
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/kanban-front:latest
